name: 安装 / 脚本问题
description: 装不上、脚本报错、或脚本"看不见却说没问题"
title: "[问题] "
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes:
      label: 用的是
      options: [Claude Code（插件安装）, Claude Code（git clone 安装）, Codex, 其他]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 终端运行 claude --version 或 codex --version
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 完整报错原文最有用。贴之前把路径里的用户名、文件名换掉
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎么复现
  - type: checkboxes
    id: privacy
    attributes:
      label: 脱敏确认
      options:
        - label: 我确认这里没有客户材料或其他机密信息
          required: true
